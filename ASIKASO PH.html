<title>ASIKASO PH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow reading column, white ground, a single blue accent taken from the logo. Rows and hairlines instead of cards. */
:root{
  --bg:#ffffff; --soft:#f4f7fb; --ink:#14213a; --muted:#5b6a80; --line:#e2e8f0;
  --blue:#0f4fb0; --blue-ink:#ffffff; --good:#12703a; --good-bg:#e3f4ea; --warn:#8a4a05; --warn-bg:#fdf0d9;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --soft:#131e33; --ink:#e8eef9; --muted:#9fb0c8; --line:#25344f;
  --blue:#7fa6ff; --blue-ink:#08132c; --good:#6fdc9b; --good-bg:#10301f; --warn:#ffc98a; --warn-bg:#35270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --soft:#131e33; --ink:#e8eef9; --muted:#9fb0c8; --line:#25344f;
  --blue:#7fa6ff; --blue-ink:#08132c; --good:#6fdc9b; --good-bg:#10301f; --warn:#ffc98a; --warn-bg:#35270f; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
a{color:var(--blue)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:10px;background:var(--blue);color:var(--blue-ink);font-weight:600;text-decoration:none;border:2px solid var(--blue);cursor:pointer;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{width:40px;height:40px;display:block}
.brand b{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.03em}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 14px;border-radius:999px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}

/* hero */
.hero{padding-block:56px 40px}
.hero p.sub{color:var(--muted);margin:16px 0 0;max-width:46ch}
.prog{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.prog .l{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.prog .l b{color:var(--ink)}
.jump{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:24px;font-size:.95rem;font-weight:500}
.jump a{text-decoration:none}
.jump a:hover{text-decoration:underline}

section{padding-block:44px;border-top:1px solid var(--line);scroll-margin-top:72px}
.intro{color:var(--muted);margin:10px 0 24px;max-width:56ch}

/* requirement rows */
ul.rows{list-style:none;margin:0;padding:0}
.req{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.have{flex:none;padding-top:5px;cursor:pointer}
.have input{appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);background:var(--bg);margin:0;display:grid;place-items:center;cursor:pointer}
.have input:checked{background:var(--good);border-color:var(--good)}
.have input:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(40deg) translate(-1px,-1px)}
details{flex:1;min-width:0}
summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 28px 2px 0;position:relative;min-height:34px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:2px;top:0;font-size:1.4rem;line-height:1.4;color:var(--muted)}
details[open] summary::after{content:"–"}
.req.done .nm{color:var(--muted)}
.n{font-size:.85rem;font-weight:600;color:var(--muted);min-width:1.2em}
.nm{font-weight:600;font-size:1.05rem}
.free{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--blue)}
.in{padding:10px 0 6px;display:flex;flex-direction:column;gap:14px;font-size:.96rem}
.in p{margin:0;color:var(--muted)}
.in ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 14px;margin:0;padding:14px;background:var(--soft);border-radius:12px}
.kv dt{font-size:.78rem;font-weight:600;color:var(--muted);padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.sub-title{margin:30px 0 4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.copy{font-family:ui-monospace,monospace;font-size:.88rem;background:var(--bg);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}

/* forms */
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 200px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%;min-width:0}
.row .btn{height:46px}

/* hiring rows */
.jobs{display:flex;flex-direction:column;margin-top:20px}
.job{padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.job h3{margin:0;font-family:var(--display);font-size:1.15rem;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.job h3 span{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.95rem}
.meta{font-size:.88rem;color:var(--muted)}
.needs{display:flex;flex-wrap:wrap;gap:6px}
.need{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;text-decoration:none}
.need.ok{background:var(--good-bg);color:var(--good)}
.need.miss{background:var(--warn-bg);color:var(--warn)}
.ready{font-size:.9rem;font-weight:600}
.ready.ok{color:var(--good)}.ready.miss{color:var(--warn)}
.how{margin:0;font-size:.93rem}
.tagx{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:5px}
.note{margin-top:18px;font-size:.85rem;color:var(--muted)}
.empty{padding:24px 0;color:var(--muted)}

/* eligibility */
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:8px 0}
.check input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--blue);flex:none}
.verdict{margin:14px 0 24px;border-radius:12px;padding:14px 16px;font-size:.95rem}
.verdict.ok{background:var(--good-bg);color:var(--good)}
.verdict.miss{background:var(--warn-bg);color:var(--warn)}
.verdict b{display:block;margin-bottom:2px}
.freelist{margin:12px 0 18px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}

footer{border-top:1px solid var(--line);padding-block:36px 56px;font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:12px}
footer img{width:36px;height:36px}
footer p{margin:0}
</style>

/* [Filipino, English, Google Maps query] */
var AGENCIES=[
 ["SSS branch","SSS branch","SSS branch"],["PhilHealth office","PhilHealth office","PhilHealth Local Health Insurance Office"],["Pag-IBIG branch","Pag-IBIG branch","Pag-IBIG Fund branch"],
 ["NBI clearance center","NBI clearance center","NBI clearance center"],["BIR office","BIR office","BIR Revenue District Office"],["City hall (occupational permit)","City hall (occupational permit)","city hall business permit and licensing office"],
 ["Barangay hall","Barangay hall","barangay hall"],["PESO (job fairs at tulong sa trabaho)","PESO (job fairs and employment help)","Public Employment Service Office PESO"],
 ["Police station","Police station","police station"],["PSA Serbilis Center","PSA Serbilis Center","PSA Serbilis Center"]
];
/* Para mag-post ng totoong hiring: palitan ang laman nito. needs = id ng requirements sa itaas. type: Full-time, Part-time o Online. */
var HIRING=[
 {company:"Halimbawa Retail Corp.",role:"Sales Associate",place:"Las Piñas City",type:"Full-time",posted:"2026-11-02",until:"2026-11-30",needs:["birth","tin","sss","philhealth","pagibig","nbi"],
  how:["Walk-in Lunes hanggang Biyernes, 9:00 AM hanggang 3:00 PM. Dalhin ang resume at photocopy ng mga ID.","Walk in Monday to Friday, 9:00 AM to 3:00 PM. Bring your resume and photocopies of your IDs."],sample:1},
 {company:"Halimbawa BPO Inc.",role:"Customer Support",place:"Online, work from home",type:"Online",posted:"2026-10-30",until:"2026-11-20",needs:["birth","tor","nbi","sss","philhealth","pagibig","tin"],
  how:["Mag-email ng resume sa hr@halimbawa.example at isulat ang \"Customer Support\" sa subject.","Email your resume to hr@halimbawa.example with \"Customer Support\" in the subject."],sample:1},
 {company:"Halimbawa Foods Inc.",role:"Kitchen Crew",place:"Parañaque City",type:"Part-time",posted:"2026-10-28",until:"2026-11-15",needs:["birth","nbi","permit","sss"],
  how:["Mag-apply sa branch at hanapin ang store manager. Bukas ang interview tuwing Sabado.","Apply at the branch and ask for the store manager. Interviews are open on Saturdays."],sample:1},
 {company:"Halimbawa Construction",role:"Admin Assistant",place:"Muntinlupa City",type:"Full-time",posted:"2026-10-25",until:"2026-11-25",needs:["tor","birth","tin","nbi"],
  how:["Tumawag sa HR para magpa-schedule ng interview.","Call HR to schedule an interview."],sample:1}
];
var TYPES=[["","all"],["Full-time","Full-time"],["Part-time","Part-time"],["Online","Online"]];
var MON={fil:["Ene","Peb","Mar","Abr","May","Hun","Hul","Ago","Set","Okt","Nob","Dis"],en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};

/* ============ STATE ============ */
var HK="asikaso.have",LK="asikaso.lang",mem=[];
function loadHave(){try{var v=JSON.parse(localStorage.getItem(HK)||"[]");return Array.isArray(v)?v:[]}catch(e){return mem}}
function saveHave(){try{localStorage.setItem(HK,JSON.stringify(have))}catch(e){mem=have.slice()}}
function loadLang(){try{var v=localStorage.getItem(LK);if(v==="en"||v==="fil")return v}catch(e){}return "fil"}
var have=loadHave(),L=loadLang();
var byId={};REQS.forEach(function(r){byId[r.id]=r});
var CORE=REQS.filter(function(r){return r.core});
function has(id){return have.indexOf(id)>-1}
function I(){return L==="en"?1:0}
function t(k,v){var s=T[L][k];if(v)for(var x in v)s=s.replace("{"+x+"}",v[x]);return s}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function mapUrl(q,place){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q+(place?" "+place:""))}
var $=function(id){return document.getElementById(id)};

/* ============ RENDER ============ */
function applyStatic(){
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t(e.dataset.ph)});
  document.documentElement.lang=L==="en"?"en":"fil";
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===L)});
}
function reqRow(r,n){
  var i=I(),acts="";
  if(r.link)acts+='<a class="btn sm" target="_blank" rel="noopener" href="'+r.link[1]+'">'+esc(r.link[0])+'</a>';
  if(r.map)acts+='<a class="btn sm ghost" target="_blank" rel="noopener" href="'+mapUrl(r.map,"")+'">'+t("find")+'</a>';
  var kv='<dt>'+t("bring")+'</dt><dd>'+esc(r.docs[i])+'</dd><dt>'+t("cost")+'</dt><dd>'+esc(r.cost[i])+'</dd>';
  if(r.email)kv+='<dt>'+t("email")+'</dt><dd><span class="copy">'+esc(r.email)+'</span></dd>';
  if(r.tip)kv+='<dt>'+t("tip")+'</dt><dd>'+esc(r.tip[i])+'</dd>';
  return '<li class="req'+(has(r.id)?" done":"")+'" id="req-'+r.id+'"><label class="have"><input type="checkbox" data-have="'+r.id+'" aria-label="'+esc(t("have")+": "+r.name)+'"'+(has(r.id)?" checked":"")+'></label>'+
   '<details><summary>'+(n?'<span class="n">'+n+'</span>':'')+'<span class="nm">'+esc(r.name)+'</span>'+(r.free?'<span class="free">'+t("free")+'</span>':'')+'</summary>'+
   '<div class="in"><p>'+esc(r.what[i])+'</p><ol>'+r.steps[i].map(function(s){return "<li>"+esc(s)+"</li>"}).join("")+'</ol><dl class="kv">'+kv+'</dl>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</div></details></li>';
}
function renderReqs(){
  var open=[];document.querySelectorAll("#reqs details[open]").forEach(function(d){open.push(d.closest(".req").id)});
  var opt=REQS.filter(function(r){return !r.core});
  $("reqs").innerHTML='<ul class="rows">'+CORE.map(function(r,k){return reqRow(r,k+1)}).join("")+'</ul>'+
    '<p class="sub-title">'+t("ifNeeded")+'</p><ul class="rows">'+opt.map(function(r){return reqRow(r,"")}).join("")+'</ul>';
  open.forEach(function(id){var e=$(id);if(e)e.querySelector("details").open=true});
}
function renderProgress(){
  var d=CORE.filter(function(r){return has(r.id)}).length;
  $("bar").style.width=(d/CORE.length*100)+"%";
  $("ptxt").innerHTML="<b>"+t("prog",{n:d,t:CORE.length})+"</b>";
  var nx=CORE.filter(function(r){return !has(r.id)})[0];
  $("pnext").innerHTML=nx?t("next")+' <a href="#req-'+nx.id+'" data-open="'+nx.id+'">'+esc(nx.name)+'</a>':esc(t("done"));
}
function fmt(d){var p=d.split("-");return MON[L][+p[1]-1]+" "+(+p[2])+", "+p[0]}
function renderTypes(){
  var s=$("ht"),v=s.value;
  s.innerHTML=TYPES.map(function(x){return '<option value="'+x[0]+'">'+(x[1]==="all"?t("all"):x[1])+'</option>'}).join("");
  s.value=v;
}
function renderHiring(){
  var q=$("hq").value.trim().toLowerCase(),ty=$("ht").value,i=I();
  var l=HIRING.filter(function(j){return (!ty||j.type===ty)&&(!q||(j.company+" "+j.role+" "+j.place).toLowerCase().indexOf(q)>-1)});
  $("board").innerHTML=l.map(function(j){
    var miss=j.needs.filter(function(id){return !has(id)});
    var needs=j.needs.map(function(id){return '<a class="need '+(has(id)?"ok":"miss")+'" href="#req-'+id+'" data-open="'+id+'">'+(has(id)?"✓ ":"")+esc(byId[id].name)+'</a>'}).join("");
    var ready=miss.length?'<span class="ready miss">'+t("missing",{m:miss.length,t:j.needs.length})+'</span>':'<span class="ready ok">'+t("complete")+'</span>';
    return '<article class="job"><h3>'+esc(j.role)+' <span>'+esc(j.company)+'</span>'+(j.sample?' <span class="tagx">'+t("sample")+'</span>':'')+'</h3>'+
      '<div class="meta">'+esc(j.place)+' · '+esc(j.type)+' · '+t("posted")+' '+fmt(j.posted)+' · '+t("until")+' '+fmt(j.until)+'</div>'+
      '<div class="needs">'+needs+'</div>'+ready+'<p class="how"><b>'+t("apply")+'</b> '+esc(j.how[i])+'</p></article>';
  }).join("")||'<p class="empty">'+t("empty")+'</p>';
}
function renderLoc(){
  var s=$("ag"),v=s.value||"0",i=I();
  s.innerHTML=AGENCIES.map(function(a,k){return '<option value="'+k+'">'+esc(a[i])+'</option>'}).join("");
  s.value=v;updLoc();
}
function updLoc(){$("gm").href=mapUrl(AGENCIES[+$("ag").value][2],$("pl").value.trim())}
function renderFree(){
  var m=[["e1","m1"],["e2","m2"],["e3","m3"]].filter(function(x){return !$(x[0]).checked}),v=$("verdict");
  if(!m.length){v.className="verdict ok";v.innerHTML="<b>"+t("vOkT")+"</b>"+esc(t("vOk"))}
  else{v.className="verdict miss";v.innerHTML="<b>"+t("vMissT")+"</b>"+esc(t("vMiss")+m.map(function(x){return t(x[1])}).join("; ")+".")}
  $("freelist").innerHTML=FREE.map(function(f){return "<li>"+esc(f[I()])+"</li>"}).join("");
}
function renderAll(){applyStatic();renderReqs();renderProgress();renderTypes();renderHiring();renderLoc();renderFree()}
function setLang(l){L=l;try{localStorage.setItem(LK,l)}catch(e){}renderAll()}

/* ============ EVENTS ============ */
function openReq(id){renderReqs();var e=$("req-"+id);if(e){e.querySelector("details").open=true;e.scrollIntoView({block:"center"})}}
document.addEventListener("click",function(e){
  var o=e.target.closest("[data-open]");
  if(o){e.preventDefault();openReq(o.dataset.open);return}
  var b=e.target.closest(".lang button");
  if(b)setLang(b.dataset.lang);
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.have){
    var id=el.dataset.have,i=have.indexOf(id);
    if(el.checked&&i<0)have.push(id);if(!el.checked&&i>-1)have.splice(i,1);
    saveHave();el.closest(".req").classList.toggle("done",el.checked);
    renderProgress();renderHiring();
  }
  if(el.id==="e1"||el.id==="e2"||el.id==="e3")renderFree();
  if(el.id==="ht")renderHiring();
  if(el.id==="ag")updLoc();
});
$("hq").addEventListener("input",renderHiring);
$("pl").addEventListener("input",updLoc);
$("loc").addEventListener("submit",function(e){e.preventDefault()});
renderAll();
})();
</script>

</body></html>
